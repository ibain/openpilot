# Rebuilds rx-dev-mads each day as upstream xnor rx-dev plus .github/mads/rivian-mads.patch.
# If the patch no longer applies, compiles, or pushes, rx-dev-mads is left as is and an issue is opened.
name: sync rx-dev-mads

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-rx-dev-mads

env:
  UPSTREAM_URL: https://github.com/xnor-tech/openpilot.git
  UPSTREAM_BRANCH: rx-dev
  BRANCH: rx-dev-mads
  PATCH: .github/mads/rivian-mads.patch
  ISSUE_TITLE: rx-dev-mads sync failed

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: master
          sparse-checkout: .github/mads
          persist-credentials: false

      - name: Rebuild rx-dev-mads
        id: sync
        env:
          ORIGIN_URL: https://github.com/${{ github.repository }}.git
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/master/$PATCH"
          log="$RUNNER_TEMP/sync.log"
          fail() { echo "$1" > "$RUNNER_TEMP/error"; echo "::error::$1"; cat "$log" 2>/dev/null || true; exit 1; }

          git init -q "$RUNNER_TEMP/work" && cd "$RUNNER_TEMP/work"
          git config user.name 'github-actions[bot]'
          git config user.email '41898583+github-actions[bot]@users.noreply.github.com'

          git fetch -q "$UPSTREAM_URL" "$UPSTREAM_BRANCH" || fail "could not fetch upstream $UPSTREAM_BRANCH"
          upstream=$(git rev-parse FETCH_HEAD)
          echo "upstream_sha=$upstream" >> "$GITHUB_OUTPUT"

          current=$(git ls-remote "$ORIGIN_URL" "refs/heads/$BRANCH" | cut -f1)
          if [ -n "$current" ]; then git fetch -q "$ORIGIN_URL" "$current"; fi

          git checkout -q --detach "$upstream"
          git am "$patch" > "$log" 2>&1 || fail "$PATCH does not apply to upstream $UPSTREAM_BRANCH $upstream"

          git diff -z --name-only --diff-filter=d HEAD^ HEAD -- '*.py' | xargs -0 -r python3 -m py_compile > "$log" 2>&1 \
            || fail "patched Python files do not compile on upstream $UPSTREAM_BRANCH $upstream"

          if [ -n "$current" ] && [ "$(git rev-parse -q --verify "$current^")" = "$upstream" ] \
             && [ "$(git rev-parse "$current^{tree}")" = "$(git rev-parse HEAD^{tree})" ]; then
            echo "$BRANCH is already upstream $upstream plus the patch"
            exit 0
          fi

          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $auth" push --force-with-lease="refs/heads/$BRANCH:$current" \
            "$ORIGIN_URL" "HEAD:refs/heads/$BRANCH" > "$log" 2>&1 || fail "push to $BRANCH was refused"
          echo "$BRANCH updated to $(git rev-parse HEAD) on upstream $upstream"

      - name: Open or update sync-failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          error=$(cat "$RUNNER_TEMP/error" 2>/dev/null || echo "sync job failed before rebuilding $BRANCH")
          body="$(printf '%s\n\nUpstream %s: `%s`\n%s was left unchanged.\nRun: %s\n\n```\n%s\n```\n' \
            "$error" "$UPSTREAM_BRANCH" "${UPSTREAM_SHA:-unknown}" "$BRANCH" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$(tail -n 40 "$RUNNER_TEMP/sync.log" 2>/dev/null || true)")"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$body"
          fi

      - name: Close sync-failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Synced cleanly on upstream $UPSTREAM_BRANCH \`$UPSTREAM_SHA\`."
          fi
